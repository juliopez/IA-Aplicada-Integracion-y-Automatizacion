name: ia-aplicada-empresa
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina contraseña}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.local.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["127.0.0.1:3307:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  tickets:
    build: ./web
    environment:
      DB_HOST: db
      DB_NAME: mesa_ayuda
      DB_USER: mesa_app
      DB_PASSWORD: ${MESA_DB_PASSWORD:?Defina contraseña}
      API_KEY: ${LAB_API_KEY:?Defina token}
    volumes: ["./apps/tickets:/var/www/html:ro"]
    ports: ["127.0.0.1:8081:80"]
    depends_on:
      db: {condition: service_healthy}
  academico:
    build: ./web
    environment:
      DB_HOST: db
      DB_NAME: sistema_academico
      DB_USER: academico_app
      DB_PASSWORD: ${ACADEMICO_DB_PASSWORD:?Defina contraseña}
      API_KEY: ${LAB_API_KEY:?Defina token}
    volumes: ["./apps/academico:/var/www/html:ro"]
    ports: ["127.0.0.1:8082:80"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  mysql_data:
